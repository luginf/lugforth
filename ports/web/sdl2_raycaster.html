<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lugforth Raycaster</title>
<!--
  A Doom-like maze drawn by raycasting, written once with the sdl2 short
  words: the very same file, examples/games/sdl2_raycaster.fs, also runs on
  Linux with SDL2. The mouse turns (the further from the middle of the
  picture, the faster) and looks up and down; w a s d or the arrows walk and
  turn, m switches the mouse off, Esc quits.
  The Forth file is fetched with XMLHttpRequest, so serve it over http
  from out/web, where ninja web copies this page, its .fs files and lugforth.js:
  ninja web && cd out/web && python3 -m http.server
-->
<style>
  body { background: #101830; color: #fff; font-family: sans-serif; }
  #again { position: fixed; inset: 0; display: none; align-items: center;
           justify-content: center; flex-direction: column; gap: 1em;
           z-index: 200000; background: #101830; color: #fff; }
  #again button { font-size: 1.5em; padding: 0.5em 1.5em; cursor: pointer; }
</style>
<div id="again">
  <div>Game closed.</div>
  <button onclick="location.reload()">Play again</button>
</div>
<script>
  // Show "Play again" when the game closes its screen (Esc). The Forth
  // interpreter stops there because the game file ends with bye.
  (function() {
    var was = false;
    setInterval(function() {
      var s = window.lugforth && window.lugforth.sdl;
      var open = !!(s && s.open);
      if (was && !open) { document.getElementById('again').style.display = 'flex'; }
      was = open;
    }, 300);
  })();
</script>
<script type="text/forth" src="sdl2_raycaster.fs"></script>
<script src="lugforth.js"></script>
