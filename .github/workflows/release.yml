name: Release binaries

# Builds Linux (plain binary + AppImage), macOS (universal) and Windows (x64)
# binaries. Run it by hand (Actions tab, "Run workflow") to get the files as
# build artifacts, or push a tag like v7.0.8.1 to also publish them in a GitHub
# release.
#
# Linux is built in a debian:10 container on purpose: a binary uses the C
# library of the machine it runs on, so what it needs is fixed by the system
# it was built on. Debian 10 has glibc 2.28, which any distribution from the
# last years can run. Debian 10 is end of life, hence the archive.debian.org
# sources below. A fully static binary is not an option: Lugforth reaches the
# C library (open, read, socket...) and SDL2 / X11 through dlopen and dlsym,
# which do not work in a static executable.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:10
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g; /buster-updates/d' /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential python3 ninja-build git curl ca-certificates file binutils zip \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0 libsdl2-mixer-2.0-0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate the boot header
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./configure.py
          ninja out/gen/posix_boot.h

      - name: Build
        run: |
          mkdir -p dist
          # same flags as the ninja build, plus the C++ runtime linked in so
          # that only glibc is needed on the machine that runs it
          g++ -O2 -I . -I out -s -DLUGFORTH_MINIMAL -fno-exceptions -fno-stack-protector \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -no-pie -std=c++11 -static-libstdc++ -static-libgcc \
            ports/posix/main.c -o dist/lugforth -ldl
          echo "highest glibc symbol version needed:"
          objdump -T dist/lugforth | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Test
        timeout-minutes: 3
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/dist/lugforth" "$GITHUB_WORKSPACE/common/all_tests.fs" < /dev/null | tail -5

      - name: Package
        run: |
          VERSION=$(git describe --tags --always)
          mkdir -p "release/lugforth-$VERSION-linux-x86_64"
          cp dist/lugforth LICENSE NOTICE README.md "release/lugforth-$VERSION-linux-x86_64/"
          tar -C release -czf "dist/lugforth-$VERSION-linux-x86_64.tar.gz" "lugforth-$VERSION-linux-x86_64"
          # AppImage: also carries the SDL2 libraries Lugforth loads at run time
          bash tools/make_appimage.sh \
            --name lugforth \
            --binary dist/lugforth \
            --icon docs/images/lugforth_256.png \
            --comment "Forth interpreter" \
            --categories "Development;" --terminal \
            --version "$VERSION" \
            --bundle libSDL2-2.0.so.0 --bundle libSDL2_image-2.0.so.0 \
            --bundle libSDL2_ttf-2.0.so.0 --bundle libSDL2_mixer-2.0.so.0 \
            --out dist
          mv dist/lugforth-x86_64.AppImage "dist/lugforth-$VERSION-x86_64.AppImage"
          rm dist/lugforth

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate the boot header
        run: |
          brew install ninja
          ./configure.py
          ninja out/gen/posix_boot.h

      # Universal binary (Apple silicon and Intel), macOS 11 or later.
      # Not signed or notarized: on first run, right click -> Open, or
      # xattr -d com.apple.quarantine lugforth
      - name: Build
        run: |
          mkdir -p dist
          clang++ -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2 \
            -I . -I out -DLUGFORTH_MINIMAL -fno-exceptions -std=c++11 -w \
            ports/posix/main.c -o dist/lugforth -ldl
          lipo -info dist/lugforth

      - name: Test
        continue-on-error: true
        timeout-minutes: 3
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/dist/lugforth" "$GITHUB_WORKSPACE/common/all_tests.fs" < /dev/null | tail -5

      - name: Package
        run: |
          VERSION=$(git describe --tags --always)
          D="lugforth-$VERSION-macos-universal"
          mkdir -p "release/$D"
          cp dist/lugforth LICENSE NOTICE README.md "release/$D/"
          (cd release && zip -qr "../dist/$D.zip" "$D")
          rm dist/lugforth

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The boot code is turned into C headers by tools/importation.py, then
      # the MSVC compiler builds ports/windows/main.c (same steps as
      # ports/windows/BUILD, which does it from WSL).
      - name: Generate the boot headers
        shell: bash
        run: |
          mkdir -p out/gen out/resources dist
          python tools/revstamp.py "$PWD" out/gen/REVISION out/gen/REVSHORT
          for pair in windows_boot:boot windows_boot_extra:boot_extra; do
            f=${pair%%:*}; n=${pair##*:}
            python tools/importation.py -i ports/windows/$f.fs -o out/gen/$f.h \
              -I out -I . --name $n --header win \
              -DVERSION=7.0.8.1 -DSTABLE_VERSION=7.0.8.0 \
              -FREVISION=out/gen/REVISION -FREVSHORT=out/gen/REVSHORT
          done
          cp docs/images/eforth.ico out/resources/eforth.ico

      - name: Build
        shell: cmd
        run: |
          rc /nologo /i . /fo out\res64.res ports\windows\lugforth.rc
          cl /nologo /O2 /I . /I out /Fo:out\main.obj /c ports\windows\main.c
          link /nologo /OUT:dist\lugforth.exe out\main.obj out\res64.res user32.lib

      - name: Test
        continue-on-error: true
        timeout-minutes: 3
        shell: cmd
        run: |
          dist\lugforth.exe common\all_tests.fs < NUL

      - name: Package
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          D="lugforth-$VERSION-windows-x64"
          mkdir -p "release/$D"
          cp dist/lugforth.exe LICENSE NOTICE README.md "release/$D/"
          (cd release && 7z a -tzip "../dist/$D.zip" "$D" > /dev/null)
          rm dist/lugforth.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
