name: Release binaries

# Builds Linux (plain binary + AppImage), macOS (universal) and Windows (x64)
# binaries. Run it by hand (Actions tab, "Run workflow") to get the files as
# build artifacts, or push a tag like v7.0.8.1 to also publish them in a GitHub
# release.
#
# Linux is built in a debian:10 container on purpose: a binary uses the C
# library of the machine it runs on, so what it needs is fixed by the system
# it was built on. Debian 10 has glibc 2.28, which any distribution from the
# last years can run. Debian 10 is end of life, hence the archive.debian.org
# sources below. A fully static binary is not an option: Lugforth reaches the
# C library (open, read, socket...) and SDL2 / X11 through dlopen and dlsym,
# which do not work in a static executable.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:10
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g; /buster-updates/d' /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential python3 ninja-build git curl ca-certificates file binutils zip \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0 libsdl2-mixer-2.0-0 fonts-dejavu-core

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag must be the version of the BUILD file
        run: |
          V=$(sed -n "s/.*version='\([0-9.]*\)'.*/\1/p" BUILD | head -1)
          case "$GITHUB_REF" in
            refs/tags/*) [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "tag $GITHUB_REF_NAME but BUILD says v$V"; exit 1; } ;;
          esac

      - name: Generate the boot header
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./configure.py
          ninja out/gen/posix_boot.h out/gen/posix_mini_boot.h

      - name: Build
        run: |
          mkdir -p dist
          # same flags as the ninja build, plus the C++ runtime linked in so
          # that only glibc is needed on the machine that runs it
          g++ -O2 -I . -I out -s -DLUGFORTH_MINIMAL -fno-exceptions -fno-stack-protector \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -no-pie -std=c++11 -static-libstdc++ -static-libgcc \
            ports/posix/main.c -o dist/lugforth -ldl
          # lugforth-mini: no editors, SDL2, X11, console window or servers
          g++ -O2 -I . -I out -s -DLUGFORTH_MINIMAL -DLUGFORTH_MINI -fno-exceptions -fno-stack-protector \
            -fomit-frame-pointer -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -no-pie -std=c++11 -static-libstdc++ -static-libgcc \
            ports/posix/main.c -o dist/lugforth-mini -ldl
          echo "highest glibc symbol version needed:"
          objdump -T dist/lugforth | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Test
        timeout-minutes: 3
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/dist/lugforth" "$GITHUB_WORKSPACE/common/all_tests.fs" < /dev/null | tail -5
          "$GITHUB_WORKSPACE/dist/lugforth-mini" "$GITHUB_WORKSPACE/common/all_tests.fs" < /dev/null | tail -5

      - name: Test the editors in a pseudo terminal
        timeout-minutes: 3
        run: python3 tools/editors_pty_test.py dist/lugforth

      - name: Package
        run: |
          VERSION=$(git describe --tags --always)
          mkdir -p "release/lugforth-$VERSION-linux-x86_64"
          cp dist/lugforth dist/lugforth-mini README.md "release/lugforth-$VERSION-linux-x86_64/"
          sh tools/release_examples.sh "release/lugforth-$VERSION-linux-x86_64/examples"
          tar -C release -czf "dist/lugforth-$VERSION-linux-x86_64.tar.gz" "lugforth-$VERSION-linux-x86_64"
          # AppImage: also carries the SDL2 libraries Lugforth loads at run time, and the
          # examples (AppRun copies them to ~/.local/share/lugforth/examples on first run)
          mkdir -p appimage-examples
          cp -R examples/. appimage-examples/
          (cd appimage-examples && rm -rf bench Makefile system/*xtensa* system/espnow.fs games/*.py)
          bash tools/make_appimage.sh \
            --examples appimage-examples \
            --gui \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf \
            --font-license /usr/share/doc/fonts-dejavu-core/copyright \
            --name lugforth \
            --binary dist/lugforth \
            --icon docs/images/lugforth_256.png \
            --comment "Forth interpreter" \
            --categories "Development;" --terminal \
            --version "$VERSION" \
            --bundle libSDL2-2.0.so.0 --bundle libSDL2_image-2.0.so.0 \
            --bundle libSDL2_ttf-2.0.so.0 --bundle libSDL2_mixer-2.0.so.0 \
            --out dist
          mv dist/lugforth-x86_64.AppImage "dist/lugforth-$VERSION-x86_64.AppImage"
          mv dist/lugforth-mini "dist/lugforth-mini-$VERSION-linux-x86_64"
          rm dist/lugforth

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate the boot header
        run: |
          brew install ninja
          ./configure.py
          ninja out/gen/posix_boot.h

      # Universal binary (Apple silicon and Intel), macOS 11 or later.
      # Not signed or notarized: on first run, right click -> Open, or
      # xattr -d com.apple.quarantine lugforth
      - name: Build
        run: |
          mkdir -p dist
          clang++ -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2 \
            -I . -I out -DLUGFORTH_MINIMAL -fno-exceptions -std=c++11 -w \
            ports/posix/main.c -o dist/lugforth -ldl
          lipo -info dist/lugforth

      # The boot code looks up its C functions with dlsym; list the ones this
      # system does not have (a missing one stops the start silently).
      - name: Check the C functions used by ports/posix
        continue-on-error: true
        timeout-minutes: 3
        run: |
          grep -ohE 'z" [A-Za-z_0-9]+" [0-9]+ sysfunc' ports/posix/*.fs | sed -E 's/z" ([A-Za-z_0-9]+)".*/\1/' | sort -u > /tmp/names.txt
          { echo '#include <dlfcn.h>'; echo '#include <stdio.h>';
            echo 'int main(){ const char *n[]={'; sed 's/.*/"&",/' /tmp/names.txt; echo '0};';
            echo 'for(int i=0;n[i];i++) if(!dlsym(RTLD_DEFAULT,n[i])) printf("MISSING %s\n",n[i]); return 0;}'; } > /tmp/symtest.c
          clang /tmp/symtest.c -o /tmp/symtest && /tmp/symtest

      - name: Where does the start hang?
        continue-on-error: true
        timeout-minutes: 3
        run: |
          cd /tmp
          (LUGFORTH_FAULTS=1 "$GITHUB_WORKSPACE/dist/lugforth" < /dev/null > /tmp/out.txt 2>&1 &)
          sleep 3
          head -c 300 /tmp/out.txt || true
          sample lugforth 1 -file /tmp/sample.txt || true
          grep -A25 "Call graph" /tmp/sample.txt | head -40 || true
          pkill -x lugforth || true

      - name: Test
        continue-on-error: true
        timeout-minutes: 3
        run: |
          cd /tmp
          LUGFORTH_FAULTS=1 perl -e 'alarm 10; exec @ARGV' "$GITHUB_WORKSPACE/dist/lugforth" < /dev/null 2>&1 | head -c 600
          echo '1 2 + . bye' | perl -e 'alarm 20; exec @ARGV' "$GITHUB_WORKSPACE/dist/lugforth" | tail -3
          perl -e 'alarm 150; exec @ARGV' "$GITHUB_WORKSPACE/dist/lugforth" "$GITHUB_WORKSPACE/common/all_tests.fs" < /dev/null | tail -5

      # SDL2 is not bundled on the Mac: brew install sdl2 sdl2_ttf (the bindings look in the system and in
      # /opt/homebrew/lib and /usr/local/lib). Headless here, with the dummy video and audio drivers.
      - name: Test the SDL2 words
        continue-on-error: true
        timeout-minutes: 5
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          brew install sdl2 sdl2_ttf
          ls /opt/homebrew/lib | grep -i sdl2 || true
          cd "$GITHUB_WORKSPACE"
          perl -e 'alarm 120; exec @ARGV' dist/lugforth ports/posix/sdl2_tests.fs < /dev/null 2>&1 | tail -15

      - name: Package
        run: |
          VERSION=$(git describe --tags --always)
          D="lugforth-$VERSION-macos-universal"
          mkdir -p "release/$D"
          cp dist/lugforth README.md "release/$D/"
          sh tools/release_examples.sh "release/$D/examples"
          sh tools/release_docs.sh "release/$D/docs"
          (cd release && zip -qr "../dist/$D.zip" "$D")
          rm dist/lugforth

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The boot code is turned into C headers by tools/importation.py, then
      # the MSVC compiler builds ports/windows/main.c (same steps as
      # ports/windows/BUILD, which does it from WSL).
      - name: Generate the boot headers
        shell: bash
        run: |
          mkdir -p out/gen out/resources dist
          # the version comes from the root BUILD file (SetVersions)
          VERSION=$(sed -n "s/.*version='\([0-9.]*\)'.*/\1/p" BUILD | head -1)
          STABLE=$(sed -n "s/.*stable='\([0-9.]*\)'.*/\1/p" BUILD | head -1)
          python tools/revstamp.py "$PWD" out/gen/REVISION out/gen/REVSHORT
          for pair in windows_boot:boot windows_boot_extra:boot_extra; do
            f=${pair%%:*}; n=${pair##*:}
            python tools/importation.py -i ports/windows/$f.fs -o out/gen/$f.h \
              -I out -I . --name $n --header win \
              -DVERSION=$VERSION -DSTABLE_VERSION=$STABLE \
              -FREVISION=out/gen/REVISION -FREVSHORT=out/gen/REVSHORT
          done
          cp docs/images/eforth.ico out/resources/eforth.ico

      - name: Build
        shell: cmd
        run: |
          rc /nologo /i . /fo out\res64.res ports\windows\lugforth.rc
          cl /nologo /O2 /I . /I out /Fo:out\main.obj /c ports\windows\main.c
          link /nologo /OUT:dist\lugforth.exe out\main.obj out\res64.res user32.lib

      # SDL2 and SDL2_ttf for the SDL2 words (zlib license, FreeType in SDL2_ttf): the DLLs of the
      # official releases beside the exe, and the Forth bindings of the POSIX port in lib/
      - name: SDL2 libraries
        shell: bash
        run: |
          mkdir -p sdl2dl pkg/lib
          curl -sL -o sdl2dl/sdl2.zip https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10-win32-x64.zip
          curl -sL -o sdl2dl/ttf.zip https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0-win32-x64.zip
          (cd sdl2dl && 7z x -y sdl2.zip > /dev/null && 7z x -y ttf.zip > /dev/null)
          cp sdl2dl/SDL2.dll sdl2dl/SDL2_ttf.dll pkg/
          cp sdl2dl/LICENSE.txt pkg/SDL2-LICENSE.txt 2>/dev/null || true
          cp sdl2dl/README-SDL.txt pkg/ 2>/dev/null || true
          cp sdl2dl/LICENSE.*.txt pkg/ 2>/dev/null || true
          cp ports/posix/sdl2.fs ports/posix/sdl2_ttf.fs ports/posix/sdl2_console.fs ports/posix/sdl2_console_ttf.fs ports/posix/eval_copy.fs ports/posix/editor.fs ports/posix/writhdeck.fs pkg/lib/
          ls -R pkg

      - name: Test the SDL2 words
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cp dist/lugforth.exe pkg/
          cp ports/windows/sdl2_test.fs pkg/
          echo '." include ok" cr' > pkg/sdl2_test2.fs
          cd pkg
          timeout 120 ./lugforth.exe sdl2_test.fs < /dev/null 2>&1 | tee ../sdl2_test.log || true
          grep -q "ALL PASSED" ../sdl2_test.log
          grep -q "SDL2.dll" ../sdl2_test.log
          grep -q "editors ok" ../sdl2_test.log
          grep -qi "fonts/.*ttf" ../sdl2_test.log
          test "$(grep -c "include ok" ../sdl2_test.log)" = 2

      - name: Package
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          D="lugforth-$VERSION-windows-x64"
          mkdir -p "release/$D"
          cp dist/lugforth.exe README.md "release/$D/"
          cp -R pkg/lib pkg/*.dll pkg/*.txt "release/$D/" 2>/dev/null || true
          cp ports/windows/lugforth-gui.bat "release/$D/"
          rm -f "release/$D/sdl2_test.fs"
          sh tools/release_examples.sh "release/$D/examples"
          sh tools/release_docs.sh "release/$D/docs"
          (cd release && 7z a -tzip "../dist/$D.zip" "$D" > /dev/null)
          rm dist/lugforth.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # The same program built with MinGW on Linux (ninja windows-mingw), tested and packaged on Windows
  # like the MSVC one above. Both are published: the zips differ by -mingw in the name.
  mingw-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build lugforth.exe with MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./configure.py
          ninja out/windows-mingw/lugforth.exe
          mkdir -p dist && cp out/windows-mingw/lugforth.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: mingw-exe
          path: dist/lugforth.exe

  windows-mingw:
    needs: [mingw-build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: mingw-exe
          path: dist

      # SDL2 and SDL2_ttf for the SDL2 words (zlib license, FreeType in SDL2_ttf): the DLLs of the
      # official releases beside the exe, and the Forth bindings of the POSIX port in lib/
      - name: SDL2 libraries
        shell: bash
        run: |
          mkdir -p sdl2dl pkg/lib
          curl -sL -o sdl2dl/sdl2.zip https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10-win32-x64.zip
          curl -sL -o sdl2dl/ttf.zip https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0-win32-x64.zip
          (cd sdl2dl && 7z x -y sdl2.zip > /dev/null && 7z x -y ttf.zip > /dev/null)
          cp sdl2dl/SDL2.dll sdl2dl/SDL2_ttf.dll pkg/
          cp sdl2dl/LICENSE.txt pkg/SDL2-LICENSE.txt 2>/dev/null || true
          cp sdl2dl/README-SDL.txt pkg/ 2>/dev/null || true
          cp sdl2dl/LICENSE.*.txt pkg/ 2>/dev/null || true
          cp ports/posix/sdl2.fs ports/posix/sdl2_ttf.fs ports/posix/sdl2_console.fs ports/posix/sdl2_console_ttf.fs ports/posix/eval_copy.fs ports/posix/editor.fs ports/posix/writhdeck.fs pkg/lib/
          ls -R pkg

      - name: Test the SDL2 words
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cp dist/lugforth.exe pkg/
          cp ports/windows/sdl2_test.fs pkg/
          echo '." include ok" cr' > pkg/sdl2_test2.fs
          cd pkg
          timeout 120 ./lugforth.exe sdl2_test.fs < /dev/null 2>&1 | tee ../sdl2_test.log || true
          grep -q "ALL PASSED" ../sdl2_test.log
          grep -q "SDL2.dll" ../sdl2_test.log
          grep -q "editors ok" ../sdl2_test.log
          grep -qi "fonts/.*ttf" ../sdl2_test.log
          test "$(grep -c "include ok" ../sdl2_test.log)" = 2

      - name: Package
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          D="lugforth-$VERSION-windows-x64-mingw"
          mkdir -p "release/$D"
          cp dist/lugforth.exe README.md "release/$D/"
          cp -R pkg/lib pkg/*.dll pkg/*.txt "release/$D/" 2>/dev/null || true
          cp ports/windows/lugforth-gui.bat "release/$D/"
          rm -f "release/$D/sdl2_test.fs"
          sh tools/release_examples.sh "release/$D/examples"
          sh tools/release_docs.sh "release/$D/docs"
          (cd release && 7z a -tzip "../dist/$D.zip" "$D" > /dev/null)
          rm dist/lugforth.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-mingw
          path: dist/*

  # The APK is built with the SDK and NDK of the runner and the SDL2 sources. It is signed
  # with the key of the repository secrets ANDROID_KEYSTORE_B64 (the keystore in base64),
  # ANDROID_KEYSTORE_PASS and ANDROID_KEY_ALIAS when they exist, else with a new debug key:
  # an APK signed with another key cannot update an installed one, so set the secrets.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate the boot header and the web build
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nodejs
          ls -l /usr/bin/nodejs
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./configure.py
          ninja out/gen/posix_boot.h web

      - name: SDL2 sources
        run: |
          curl -sL -o "$RUNNER_TEMP/sdl2.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          tar xzf "$RUNNER_TEMP/sdl2.tar.gz" -C "$RUNNER_TEMP"

      - name: Build the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore" KEYSTORE_PASS="$KS_PASS" KEY_ALIAS="$KS_ALIAS"
          else
            echo "No release key in the secrets: signing with a new debug key"
          fi
          SDL_SRC="$RUNNER_TEMP/SDL2-2.32.10" bash ports/android/build_apk.sh
          VERSION=$(git describe --tags --always)
          mkdir -p dist
          cp out/android/lugforth.apk "dist/lugforth-$VERSION-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  # The PC (UEFI) and Raspberry Pi bare-metal images. They are not built or tried on a real
  # machine by the maintainer for every release, so a failure here must not stop the release.
  efi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gnu-efi dosfstools mtools python3 ninja-build
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -C ports/efi usb
          VERSION=$(git describe --tags --always)
          mkdir -p dist
          cp out/efi/BOOTX64.EFI "dist/lugforth-$VERSION-efi-BOOTX64.EFI"
          gzip -9 -c out/efi/usb.img > "dist/lugforth-$VERSION-efi-usb.img.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: efi
          path: dist/*

  rpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu picolibc-aarch64-linux-gnu python3 ninja-build
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -C ports/rpi all
          VERSION=$(git describe --tags --always)
          mkdir -p dist "rpi-$VERSION"
          cp -r out/rpi/pi3 out/rpi/pi4 "rpi-$VERSION/"
          cp ports/rpi/README.md "rpi-$VERSION/"
          tar czf "dist/lugforth-$VERSION-rpi.tar.gz" "rpi-$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: rpi
          path: dist/*

  # The manual: every Markdown file of docs/ in one PDF (tools/make_pdf.py). Not essential to the release.
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra lmodern fonts-dejavu
          VERSION=$(git describe --tags --always)
          python3 tools/make_pdf.py out-manual.pdf
          mkdir -p dist
          cp out-manual.pdf "dist/lugforth-$VERSION-manual.pdf"
          cp out-manual.pdf dist/lugforth-manual.pdf   # a fixed name: releases/latest/download/lugforth-manual.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: dist/*

  release:
    needs: [linux, windows, windows-mingw, macos, android, efi, rpi, manual]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-mingw
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: efi
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rpi
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: manual
          path: dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
