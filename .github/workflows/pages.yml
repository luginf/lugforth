name: GitHub Pages

# Builds the site (tools/make_pages.py) and publishes it. In the repository
# settings, Pages > Source must be "GitHub Actions".
on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', 'tools/make_pages.py', 'tools/words_added.py', 'ports/posix/SDL2*.md', 'examples/README.md', 'NOTICE', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the interpreters (word lists, web demo)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pandoc nodejs
          # configure.py looks for /usr/bin/nodejs
          [ -e /usr/bin/nodejs ] || sudo ln -s "$(command -v node)" /usr/bin/nodejs
          ./configure.py
          ninja out/posix/lugforth out/web/lugforth.js
      - name: Debug interpreter
        run: |
          sudo apt-get install -y strace
          echo '1 2 + . cr bye' | LUGFORTH_FAULTS=1 timeout 10 strace -f -o /tmp/st ./out/posix/lugforth; echo rc=$?
          head -c 3000 /tmp/st | tail -c 1500; tail -15 /tmp/st
      - name: Build the site
        run: python3 tools/make_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
