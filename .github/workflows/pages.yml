name: GitHub Pages

# Builds the site (tools/make_pages.py) and publishes it. In the repository
# settings, Pages > Source must be "GitHub Actions".
on:
  push:
    branches: [ main ]
    # the site, and what goes into demo/: the web interpreter (common/, ports/web/),
    # the games it runs (examples/sdl2_*) and the HTML examples (examples/web/)
    paths: [ 'docs/**', 'tools/make_pages.py', 'tools/words_added.py', 'ports/posix/SDL2*.md',
             'examples/README.md', 'NOTICE', '.github/workflows/pages.yml',
             'common/**', 'ports/web/**', 'examples/sdl2_*', 'examples/web/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the interpreters (word lists, web demo)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pandoc nodejs
          # configure.py looks for /usr/bin/nodejs
          [ -e /usr/bin/nodejs ] || sudo ln -s "$(command -v node)" /usr/bin/nodejs
          ./configure.py
          ninja out/posix/lugforth out/web/lugforth.js out/web/terminal.html \
            out/web/sdl2_breakout.html out/web/sdl2_breakout.fs out/web/sdl2_drums.html \
            out/web/sdl2_drums.fs out/web/sdl2_fm.html out/web/sdl2_fm.fs out/web/fm_midi_parser.fs out/web/fm_engine_web.fs out/web/sdl2_roguelike.html out/web/sdl2_roguelike.fs \
            out/web/sdl2_tiles.png out/web/sdl2_pinball.html out/web/pinball_common.fs out/web/pinball_raid.fs out/web/pinball_night.fs out/web/pinball_menu.fs
      - name: Build the site
        run: python3 tools/make_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
